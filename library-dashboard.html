<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Library Dashboard | Surya Computer</title><link rel="stylesheet" href="assets/css/style.css"><script src="assets/js/backend-config.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
.library-wrap{max-width:1100px;margin:34px auto;padding:20px}.library-hero{padding:34px;border-radius:20px;background:var(--card-bg,#fff);box-shadow:0 8px 28px rgba(0,0,0,.08);text-align:center}.library-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:24px}.library-card{padding:22px;border-radius:16px;background:var(--card-bg,#fff);box-shadow:0 6px 22px rgba(0,0,0,.08)}.library-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}.library-btn{display:inline-block;padding:12px 18px;border-radius:10px;text-decoration:none;background:#1f4f8f;color:#fff}.library-btn.alt{background:transparent;color:inherit;border:1px solid currentColor}.library-form{max-width:700px;margin:auto;display:grid;gap:12px}.library-form input,.library-form textarea,.library-form select{padding:12px;border-radius:10px;border:1px solid #ccc;width:100%;box-sizing:border-box}.library-status{margin-top:14px;padding:12px;border-radius:10px}.library-table{width:100%;border-collapse:collapse}.library-table th,.library-table td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.lock{opacity:.7}
</style>
</head>
<body><header class="site-header"><img src="assets/images/logo.png" alt="Logo" class="logo"><div class="title"><h1>SURYA DIGITAL LIBRARY</h1><p>Library Student Dashboard</p></div></header><nav class="navbar"><a href="digital-library.html">Library Home</a><a href="#" id="logout">Logout</a></nav><main class="library-wrap"><section class="library-card"><h2 id="welcome">Loading...</h2><p id="account"></p><div id="feeBox" style="margin-top:16px"></div></section><section class="library-grid"><article class="library-card"><h3>📘 Books / PDF</h3><div id="pdf">Loading...</div></article><article class="library-card"><h3>📝 Mock Tests</h3><div id="mock">Loading...</div></article><article class="library-card"><h3>🎥 Recorded Classes</h3><div id="recorded">Loading...</div></article><article class="library-card"><h3>🔴 Live Classes</h3><div id="live">Loading...</div></article></section></main>
<script>const API=window.SURYA_DATABASE_API,T=sessionStorage.getItem('SURYA_LIBRARY_TOKEN');if(!T)location.href='library-login.html';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const render=(arr,kind)=>arr.length?arr.map(x=>{const paid=String(x.accessMode||'FREE').toUpperCase()==='PAID';const unlocked=String(x.accessState||'').toUpperCase()==='UNLOCKED';const url=x['Video URL']||x['Join URL']||x['File ID']||'';return '<div class="library-card '+(paid&&!unlocked?'lock':'')+'" style="margin:8px 0;padding:14px"><b>'+esc(x.Title)+'</b><div>'+esc(x.Subject||x.Description||'')+'</div><div style="margin-top:8px">'+(paid?(unlocked?'🔓 UNLOCKED — Open':'🔒 PAID — Payment/verification required.'):'🟢 FREE — Open')+'</div>'+((!paid||unlocked)&&url?'<div style="margin-top:8px"><a class="library-btn" target="_blank" rel="noopener" href="'+esc(url)+'">Open</a></div>':'')+'</div>';}).join(''):'<p>No published content yet.</p>';
async function post(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return r.json();}
function feeBox(s){const due=Number(s.due||0);if(due<=0)return '<div class="library-status"><b>Membership:</b> PAID_COMPLETE ✅</div>';return '<div class="library-status"><b>Total Fee:</b> ₹'+Number(s.totalFee||0).toLocaleString('en-IN')+'<br><b>Paid:</b> ₹'+Number(s.paid||0).toLocaleString('en-IN')+'<br><b>Due:</b> ₹'+due.toLocaleString('en-IN')+'<div style="margin-top:10px"><input id="payAmount" type="number" min=1 max="'+due+'" value="'+due+'" style="padding:10px;width:150px"><button id="payBtn" class="library-btn" style="border:0;cursor:pointer">Pay via UPI</button></div><div id="upiBox" style="margin-top:10px"></div></div>';}
async function createPayment(){
 const amount=Number(document.getElementById('payAmount').value||0);
 const b=await post({action:'libraryCreateUpiPayment',token:T,amount:amount});
 const box=document.getElementById('upiBox');
 if(!b.success){box.textContent=b.message||'Payment request failed.';return;}
 box.innerHTML='<div style="padding:14px;border:1px solid #e5e9ef;border-radius:12px;text-align:center"><div><b>Reference:</b> '+esc(b.reference)+'</div><div><b>Amount:</b> ₹'+Number(b.amount||amount).toLocaleString('en-IN')+'</div><div><b>UPI ID:</b> '+esc((b.upi&&b.upi.id)||'')+'</div><div id="libraryUpiQr" style="display:flex;justify-content:center;margin:12px 0"></div><a class="library-btn" href="'+esc(b.upiUri)+'">Open UPI App</a><p>Payment करने के बाद status <b>PENDING VERIFICATION</b> रहेगा। Admin verification के बाद paid access unlock होगा.</p><div id="upiStatus"></div></div>';
 if(typeof QRCode!=="undefined"&&b.upiUri)new QRCode(document.getElementById('libraryUpiQr'),{text:b.upiUri,width:220,height:220});
 window.libraryUpiRequestId=b.requestId||''; pollLibraryPayment();
}
async function pollLibraryPayment(){if(!window.libraryUpiRequestId)return;for(let i=0;i<15;i++){await new Promise(r=>setTimeout(r,8000));try{const d=await post({action:'upiPaymentStatus',requestId:window.libraryUpiRequestId});if(d.success){const el=document.getElementById('upiStatus');if(el)el.innerHTML='<b>Status:</b> '+esc(d.status)+(d.receiptNumber?'<br><b>Receipt:</b> '+esc(d.receiptNumber):'');if(d.status==='VERIFIED_SUCCESS'||d.status==='REJECTED')break;}}catch(e){break;}}}
async function load(){try{const r=await post({action:'libraryContent',token:T});const d=await r;if(!d.success)throw new Error(d.message||'Session expired');document.getElementById('welcome').textContent='Welcome, '+(d.student.name||'Library Student');document.getElementById('account').textContent='Library ID: '+d.student.libraryId+' • Membership: '+d.student.membershipPlan;document.getElementById('feeBox').innerHTML=feeBox(d.student);const pb=document.getElementById('payBtn');if(pb)pb.onclick=createPayment;document.getElementById('pdf').innerHTML=render(d.pdfs);document.getElementById('mock').innerHTML=render(d.mock);document.getElementById('recorded').innerHTML=render(d.recorded);document.getElementById('live').innerHTML=render(d.live);}catch(e){sessionStorage.removeItem('SURYA_LIBRARY_TOKEN');document.getElementById('welcome').textContent='Please login again';}};load();document.getElementById('logout').onclick=async e=>{e.preventDefault();try{await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'libraryLogout',token:T})})}finally{sessionStorage.removeItem('SURYA_LIBRARY_TOKEN');location.href='library-login.html';}};</script></body></html>
