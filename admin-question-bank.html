<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SURYA — Question Bank</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#162033}.wrap{max-width:1100px;margin:auto;padding:20px}.panel{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0000000d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd4df;border-radius:8px;background:#fff;color:#162033}textarea{min-height:230px}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:#1f5eff;color:#fff;margin:4px}.btn.secondary{background:#64748b}.small{font-size:13px;color:#64748b}.q{border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin:10px 0}.ok{color:#16823b}.err{color:#c62828}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.fixed{width:auto!important;flex:0 0 auto!important}
</style></head><body><main class="wrap"><h1>🧠 Question Bank</h1><p class="small">Reusable questions. Import text extracted from a PDF, review/edit, save, then attach selected questions to an existing Mock Test.</p><div id="msg"></div>
<section class="panel"><h2>1. Import Questions from PDF/Text</h2><div class="grid"><select id="course"></select><select id="subject"></select><input id="sourceName" placeholder="Source file / book name"></div><p class="small">Supported text pattern: <b>1. Question</b> → <b>A. ... B. ... C. ... D. ...</b> → <b>Answer: B</b> → optional <b>Marks: 1</b>.</p><textarea id="raw" placeholder="Paste extracted PDF text here..."></textarea><button class="btn" onclick="previewImport()">🔎 Preview Questions</button><button class="btn" onclick="importQuestions()">💾 Save to Question Bank</button><div id="preview"></div></section>
<section class="panel"><h2>2. Question Bank</h2><div class="grid"><select id="filterCourse"></select><select id="filterSubject"></select><select id="testSelect"></select></div><div class="row"><button class="btn" onclick="loadBank()">Refresh</button><button class="btn" onclick="attachSelected()">➕ Add Selected to Mock Test</button></div><div id="bank"></div></section></main>
<script>
"use strict";const API=window.SURYA_DATABASE_API,TOKEN=sessionStorage.getItem("SURYA_ADMIN_TOKEN");let courses=[],subjects=[],tests=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}function message(t,e=false){document.getElementById("msg").innerHTML=`<p class="${e?'err':'ok'}">${esc(t)}</p>`;}
async function api(b){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...b,token:TOKEN})});const d=await r.json();if(!d.success)throw Error(d.message||"Request failed");return d;}
async function init(){try{const[c,s,t]=await Promise.all([api({action:"courses"}),api({action:"courseSubjects"}),api({action:"mockTests"})]);courses=(c.courses||[]).filter(x=>String(x.Status||"Active").toLowerCase()==="active");subjects=(s.subjects||[]).filter(x=>String(x.Status||"Active").toLowerCase()==="active");tests=t.tests||[];fill();loadBank();}catch(e){message(e.message,true)}}
function opts(arr,fn){return arr.map(fn).join("")}
function fill(){const cs=document.getElementById("course"),fc=document.getElementById("filterCourse"),ts=document.getElementById("testSelect");cs.innerHTML='<option value="">Select Course</option>'+opts(courses,c=>`<option value="${esc(c['Course ID'])}">${esc(c['Course ID'])} — ${esc(c['Course Name'])}</option>`);fc.innerHTML='<option value="">All Courses</option>'+opts(courses,c=>`<option value="${esc(c['Course ID'])}">${esc(c['Course ID'])}</option>`);ts.innerHTML='<option value="">Select Mock Test</option>'+opts(tests,t=>`<option value="${esc(t['Test ID'])}">${esc(t['Test ID'])} — ${esc(t['Title'])}</option>`);cs.onchange=()=>fillSubjects("course","subject");fc.onchange=()=>fillSubjects("filterCourse","filterSubject");fillSubjects("course","subject");fillSubjects("filterCourse","filterSubject");}
function fillSubjects(cId,sId){const c=document.getElementById(cId).value,s=document.getElementById(sId);const a=subjects.filter(x=>String(x.Course||"").toLowerCase()===c.toLowerCase());s.innerHTML='<option value="">'+(c?'Select Subject':'All Subjects')+'</option>'+a.map(x=>`<option value="${esc(x['Subject ID'])}">${esc(x['Subject ID'])} — ${esc(x['Subject Name'])}</option>`).join("");}
let preview=[];function parseLocal(raw){const lines=String(raw||"").replace(/\r/g,"").split("\n");const out=[];let q=null,active=null;function flush(){if(q&&q.question&&q.o.A&&q.o.B&&q.o.C&&q.o.D&&q.a)out.push({...q});q=null;active=null}for(let line of lines){line=line.trim();if(!line)continue;let m=line.match(/^(?:Q(?:uestion)?\s*)?(\d+)\s*[\.\):\-]\s*(.+)$/i);if(m){flush();q={question:m[2],o:{},a:"",marks:1};active='question';continue}m=line.match(/^([ABCD])\s*[\.\):\-]\s*(.+)$/i);if(m){q=q||{question:"",o:{},a:"",marks:1};q.o[m[1].toUpperCase()]=m[2];active=m[1].toUpperCase();continue}m=line.match(/^(?:answer|correct\s*answer|ans)\s*[:\-]\s*([ABCD])/i);if(m){q=q||{question:"",o:{},a:"",marks:1};q.a=m[1].toUpperCase();continue}m=line.match(/^(?:marks?|mark)\s*[:\-]?\s*(\d+(?:\.\d+)?)/i);if(m){q=q||{question:"",o:{},a:"",marks:1};q.marks=Number(m[1]);continue}if(!q){q={question:line,o:{},a:"",marks:1};active='question'}else if(active&&q.o[active])q.o[active]+=' '+line;else q.question+=' '+line}flush();return out}
function previewImport(){preview=parseLocal(document.getElementById('raw').value);document.getElementById('preview').innerHTML=preview.length?preview.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.question)}</b><br>A. ${esc(q.o.A)}<br>B. ${esc(q.o.B)}<br>C. ${esc(q.o.C)}<br>D. ${esc(q.o.D)}<br><span class="small">Answer: ${esc(q.a)} • Marks: ${esc(q.marks)}</span></div>`).join(''):`<p class="err">No complete questions detected.</p>`}
async function importQuestions(){try{if(!preview.length)preview=parseLocal(document.getElementById('raw').value);if(!preview.length)throw Error('Preview at least one question first.');const c=document.getElementById('course').value,s=document.getElementById('subject').value;if(!c||!s)throw Error('Course and Subject are required.');const sn=String(document.getElementById('sourceName').value||'Pasted Text');const d=await api({action:'importQuestionBankText',course:c,subjectId:s,subjectName:(subjects.find(x=>String(x['Subject ID'])===s)||{})['Subject Name']||'',sourceName:sn,sourceType:'TEXT',rawText:document.getElementById('raw').value,actor:'ADMIN'});message(`✅ ${d.importedCount} questions saved.`);document.getElementById('raw').value='';preview=[];loadBank()}catch(e){message(e.message,true)}}
async function loadBank(){try{const c=document.getElementById('filterCourse').value,s=document.getElementById('filterSubject').value,d=await api({action:'questionBank',course:c,subjectId:s,status:'ACTIVE'});renderBank(d.questions||[])}catch(e){message(e.message,true)}}
function renderBank(arr){document.getElementById('bank').innerHTML=arr.length?arr.map(q=>`<div class="q"><label><input class="fixed qb" type="checkbox" value="${esc(q['Question ID'])}"> <b>${esc(q['Question ID'])}</b></label><br>${esc(q.Question)}<br><span class="small">A: ${esc(q['Option A'])} | B: ${esc(q['Option B'])} | C: ${esc(q['Option C'])} | D: ${esc(q['Option D'])} • Answer: ${esc(q['Correct Answer'])} • ${esc(q.Marks)} marks</span></div>`).join(''):'<p>Question Bank empty for this filter.</p>'}
async function attachSelected(){try{const test=document.getElementById('testSelect').value;if(!test)throw Error('Select a Mock Test.');const ids=[...document.querySelectorAll('.qb:checked')].map(x=>x.value);if(!ids.length)throw Error('Select at least one question.');const d=await api({action:'attachQuestionBankToMock',questionIds:ids,testId:test});message(`✅ ${d.attached} question(s) added to Mock Test.`)}catch(e){message(e.message,true)}}
init();
</script><script src="assets/js/project-ui.js"></script></body></html>
